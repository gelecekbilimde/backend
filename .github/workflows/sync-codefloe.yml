name: Sync to Codefloe

on:
  push:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Codefloe
        env:
          CODEFLOE_USER: ${{ secrets.CODEFLOE_USER }}
          CODEFLOE_TOKEN: ${{ secrets.CODEFLOE_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          git remote add codefloe "https://${CODEFLOE_USER}:${CODEFLOE_TOKEN}@codefloe.com/gelecekbilimde/${REPO_NAME}.git"
          git push codefloe --all --force
          git push codefloe --tags --force
